name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest -k expression narrowing the test run'
        required: false
        default: ''

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-2022]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        # 3.9/3.10/3.11 are pinned to the micro current at the 2023-04-16 release
        # date (3.9.13 is the newest 3.9 actions/python-versions ships for both
        # ubuntu-22.04 and Windows). Later micros of these branches changed
        # `html.parser` to treat <iframe> content as raw text, which breaks this
        # release's iframe tests. 3.7/3.8 are unaffected and stay unpinned, since
        # no 3.7/3.8 micro is published for both runner images.
        include:
          - tox-env: py37
            python-version: 3.7
          - tox-env: py38
            python-version: 3.8
          - tox-env: py39
            python-version: 3.9.13
          - tox-env: py310
            python-version: '3.10.11'
          - tox-env: py311
            python-version: '3.11.3'
          - tox-env: nolxml
            python-version: '3.11.3'
          - tox-env: nohtml5lib
            python-version: '3.10.11'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}
      PIP_INDEX_URL: 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v3.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          python -m tox -- -k "${{ inputs.test-filter }}"
        else
          python -m tox
        fi
