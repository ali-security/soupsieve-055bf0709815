name: deploy

on:
  workflow_dispatch:

jobs:

  pypi:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      PIP_INDEX_URL: 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Package
        run: |
          pip install --upgrade build
          pip install hatchling==1.14.0
          python -m build -s -w -n
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
